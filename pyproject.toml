[build-system]
requires = ["uv_build>=0.12.11,<0.13"]
build-backend = "uv_build"


[project]
name = "wheelforge"
description = "Convert OS binaries into PyPI-installable python wheels"
readme = "README.md"
version = "1.0.1"
requires-python = ">=3.14"
keywords = [
    "wheel",
    "packaging",
    "pypi",
    "binary",
    "executable",
    "cli",
    "distribution",
    "cross-platform",
    "platform-tag",
    "manylinux",
]
license="MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Archiving :: Packaging",
    "Topic :: System :: Software Distribution",
    "Typing :: Typed",
]
dependencies = [
    "build>=1.6.0",
    "packaging>=26.3",
    "typer>=0.27.2",
    "uv_build>=0.12.11,<0.13",
]

[project.scripts]
wheelforge = "wheelforge.cli:app"

[project.urls]
repository = "https://github.com/krishdesai7/wheelforge"
Changelog = "https://github.com/krishdesai7/wheelforge/blob/main/CHANGELOG.md"
Releases = "https://github.com/krishdesai7/wheelforge/releases"

[[project.authors]]
name = "Krish Desai"
email = "krish@desai.ml"

[dependency-groups]
dev = [
    "complexipy>=8.0.1",
    "pyrefly>=1.2.0",
    "pytest>=9.1.1",
    "ruff>=0.16.6",
    "rust-just>=1.58.0",
]

release = ["rooster==0.1.1"]

[tool.uv]
required-version = ">=0.12.11"
preview-features = true

[tool.uv.build-backend]
module-name = "wheelforge"

[[tool.uv.cache-keys]]
file = "pyproject.toml"


[tool.rooster]
changelog-contributors = false
major-labels = []
minor-labels = ["breaking"]
ignore-labels = ["internal", "ci", "testing", "automations"]

[tool.rooster.section-labels]
"Breaking changes" = ["breaking"]
"Enhancements" = ["enhancement", "compatibility", "error messages"]
"Preview features" = ["preview"]
"Configuration" = ["configuration"]
"Performance" = ["performance"]
"Bug fixes" = ["bug"]
"Rust API" = ["rustlib"]
"Documentation" = ["documentation"]
"Other changes" = ["__unknown__"]


[tool.pyright]
venvPath = "."
venv = ".venv"
stubPath = ""
extraPaths = []


[tool.ruff]
src = ["src"]
line-length = 88
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
future-annotations = true
preview = true
extend-select = [
    "B",   # flake8-bugbear: likely bugs / footguns
    "I",   # isort-style import checks
    "UP",  # pyupgrade: modern Python syntax
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes (catches undefined variables, broken logic, unused imports)
    "C90", # mccabe: Cyclomatic complexity limits (keeps functions small and readable)
    "N",   # pep8-naming: Enforces PEP 8 naming conventions (PascalCase classes, snake_case functions)
    "ASYNC", # flake8-async: Catches bad async programming practices and deadlocks
    "S",   # flake8-bandit: Security auditing (e.g., hardcoded credentials, unsafe temp files)
    "A",   # flake8-builtins: Prevents shadowing built-in names (e.g., re-defining `id`, `list`, or `format`)
    "FA",  # flake8-future-annotations: Enforces modern postponed annotations behavior
    "PIE", # flake8-pie: Code simplification suggestions
    "PT",  # flake8-pytest-style: Enforces idiomatic pytest fixture/assertion style
    "RET", # flake8-return: Simplifies return statements (removes unnecessary else/elif blocks)
    "SIM", # flake8-simplify: Refactors unnecessarily complex logic into cleaner idiomatic Python
    "ARG", # flake8-unused-arguments: Flags unused function arguments
    "PTH", # flake8-use-pathlib: Forces the use of modern `pathlib.Path` over legacy `os.path`
    "PGH", # pygrep-hooks: Prevents generic blanket `# type: ignore` or `# noqa` directives without specific error codes
    "RUF", # Ruff-specific rules: Catches edge-cases, invalid regexes, and native Ruff optimization hints
    "PERF", # Perflint: Highlights performance anti-patterns in loops and data structures
    "FURB", # refurb: Modernizes older idiom patterns to modern Python standards
    "T20",  # (flake8-print): Disallows print() statements in production code. Useful if you want to force all output through logging or dedicated output pipelines.
    "LOG",  # (flake8-logging): Flags logging anti-patterns (such as string formatting inside logger calls instead of passing lazy arguments).
    "TC",  # (flake8-type-checking): Automatically moves type-only imports behind if TYPE_CHECKING: blocks to reduce runtime import overhead.
]

[tool.ruff.lint.per-file-ignores]
"tests/**.py" = ["assert"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true


[tool.ty]


[tool.pyrefly]
python-interpreter-path = ".venv/bin/python"
site-package-path = []
check-unannotated-defs = true
infer-return-types = "checked"
search-path = ["src", "."]
preset = "all"
permissive-ignores = true

[tool.pyrefly.errors]
implicit-bool = false


[tool.complexipy]
paths = ["."]
max-complexity-allowed = 10
sort = "desc"
check-script = true
no-ignore = true
ignore-complexity = true
failed = true
